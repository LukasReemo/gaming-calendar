- logical_key: patch-12-1-5
  title: Midnight 12.1.5 Content Update (Europe)
  type: major_update
  status: confirmed
  source_url: https://news.blizzard.com/en-us/article/24307306/midnight-s-12-1-5-content-update-is-now-live
  notes: The European rollout was announced for October 14, 2026 with weekly maintenance;
    Blizzard now confirms 12.1.5 is live. Includes the Kith'ix single-boss raid, nine-chamber
    Labyrinth of Kindo'jan, Season 2 refresh, campaign, and Aqir Invasions. The content-update
    milestone retains its European date and stable identity; no exact maintenance-completion
    hour is verified.
  date: '2026-10-14'
  id: world-of-warcraft-retail-patch-12-1-5
  game_id: world-of-warcraft-retail
  updated_at: '2026-10-16T06:03:11+00:00'
- logical_key: initial-raids-unlock
  title: Initial Raids Unlock
  type: major_update
  status: confirmed
  date: '2026-12-09'
  source_url: https://news.blizzard.com/en-us/article/24303862/world-of-warcraft-forever-whats-next-panel-recap
  notes: Blizzard's Forever roadmap explicitly dates new raid unlocks for December
    9 after the November release. No opening hour or region-specific timing is supplied,
    so this entry uses the announced all-day date. This milestone is independent of
    Classic and Retail.
  id: world-of-warcraft-forever-initial-raids-unlock
  game_id: world-of-warcraft-forever
  updated_at: '2026-10-16T06:03:11+00:00'
- logical_key: server-slam-eu
  title: Server Slam Stress Test (Europe)
  type: beta
  status: confirmed
  start_at: '2026-10-21T19:00:00+02:00'
  source_timezone: Europe/Prague
  source_url: https://news.blizzard.com/en-us/article/24302072/updated-oct-16-join-the-world-of-warcraft-forever-stress-test
  notes: Blizzard's October 16 correction moves the EU regional stress test from October
    19 to October 21 at 19:00 CEST. No subscription, Game Time, invitation, or beta
    access is required. Beta goes offline shortly before the test and is expected
    back afterwards; stress-test characters, names, and guilds are wiped at the end.
    No exact end time is announced; the calendar's default one-hour slot is not a
    confirmed test duration.
  id: world-of-warcraft-forever-server-slam-eu
  game_id: world-of-warcraft-forever
  updated_at: '2026-10-20T05:56:05+00:00'

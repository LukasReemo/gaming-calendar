- logical_key: beta-final-day
  title: 'Beta: Last Full Testing Day'
  type: beta
  status: confirmed
  source_url: https://worldofwarcraft.blizzard.com/en-us/news/24304160/the-world-of-warcraft-forever-beta-now-live
  notes: Blizzard explicitly identifies October 21, 2026 as the last full day of testing.

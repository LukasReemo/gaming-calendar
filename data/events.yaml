- logical_key: beta-start
  title: Beta Begins
  type: beta
  status: confirmed
  source_url: https://worldofwarcraft.blizzard.com/en-us/news/24304160/the-world-of-warcraft-forever-beta-now-live
  notes: Official beta begins September 17, 2026 and remains available through October

events:
- id: path-of-exile-2-full-release
  game_id: path-of-exile-2
  title: Full Release 1.0
  type: release
  date: '2026-12-11'
  source_url: https://www.pathofexile.com/forum/view-thread/3999366
  notes: Leaves Early Access and becomes free-to-play, introducing the Duelist. The
    publisher announces December 11 in Pacific Time; an exact launch hour was not
    verified, so this all-day entry uses the announced date.
  status: confirmed
  updated_at: '2026-10-09T07:21:18.273524+00:00'
- id: gray-zone-warfare-rogue-ops-supporter-preview
  game_id: gray-zone-warfare
  title: Rogue Ops 0.5 Supporter Preview
  type: early_access
  date: '2026-10-19'
  source_url: https://www.grayzonewarfare.com/news/update-05-teaser
  notes: Early preview of the major Rogue Ops update, available to Supporter Edition
    owners only. This is a preview milestone, not the public update release or a new
    base-game launch. Launch time has not been announced in this source.
  status: confirmed
  updated_at: '2026-10-05T18:38:49Z'
- id: gray-zone-warfare-rogue-ops
  game_id: gray-zone-warfare
  title: Rogue Ops 0.5
  type: major_update
  date: '2026-10-22'
  source_url: https://www.grayzonewarfare.com/news/new-content-rogue-ops-devlog
  notes: Major Rogue Ops update and transition to alpha, adding Hideout building,
    crafting, smuggling, seven weapons, 370 weapon parts, three Tier 4 locations,
    and new tasks. A soft wipe preserves rank, apparel, vendor levels and completed
    tasks but resets lockers and money. The October 11 devlog reconfirms October 22;
    no exact launch hour is announced.
  status: confirmed
  updated_at: '2026-10-13T06:04:42.309789+00:00'
- id: crimson-desert-charting-the-unknown
  game_id: crimson-desert
  title: Charting the Unknown
  type: dlc
  start_at: '2026-10-29T22:00:00Z'
  source_timezone: UTC
  source_url: https://crimsondesert.pearlabyss.com/en-US/News/Notice/Detail?_boardNo=134
  notes: 'Revised release date replaces the original October 15 announcement after
    a two-week delay. Official release time: October 29, 2026 at 22:00 UTC, or 23:00
    Europe/Prague (CET). The publisher notice incorrectly labels the European timezone
    CEST for this date.'
  status: confirmed
  updated_at: '2026-10-06T14:00:00Z'
- id: arc-raiders-frozen-trail
  game_id: arc-raiders
  title: Frozen Trail
  type: major_update
  date: '2026-10-08'
  source_url: https://arcraiders.com/news/frozen-trail-content-preview
  notes: Major content update adding Pendola Pass, the Frigate challenge, new ARC
    enemies, Outposts, weapon upgrades, gadgets, and Reward Passes. The official content
    preview confirms October 8 but provides no exact launch hour. The separately announced
    free-play start time is not used as the update's launch time; cosmetic DLC and
    free-play promotions are not separate calendar events.
  status: confirmed
  updated_at: '2026-10-06T14:06:31Z'
- id: marathon-nightfall-refresh
  game_id: marathon
  title: Nightfall Refresh
  type: major_update
  date: '2026-10-06'
  source_url: https://www.bungie.net/7/en/News/Article/marathon_update_1_1_9_2
  notes: Nightfall Refresh is live with a progression and economy reset, a free NuCaloric
    Rewards Pass, reduced faction reputation requirements, solo PvE tuning, quality-of-life
    improvements, and balance changes. This is a refresh within Nightfall rather than
    a new season. Official patch notes confirm the release but do not supply an exact
    launch hour.
  status: confirmed
  updated_at: '2026-10-07T15:47:52+00:00'
- id: marathon-symbiosis
  game_id: marathon
  title: Symbiosis
  type: major_update
  date: '2026-12-08'
  source_url: https://www.bungie.net/7/en/News/Article/nighfall_refresh_symbiosis_roadmap
  notes: Major update introducing permanent PvE, an expanded Perimeter, the Bishop
    Runner shell, a social space with a firing range, Team Deathmatch, and improved
    onboarding. Bungie reconfirms December 8 without an exact launch hour; the broader
    March 2027 evolution remains undated.
  status: confirmed
  updated_at: '2026-10-07T15:47:52+00:00'
- logical_key: season-02
  title: Season 02
  type: season
  date: '2026-10-15'
  status: confirmed
  source_url: https://steamcommunity.com/app/1867240/announcements/
  notes: The October 9 Season 02 preview reconfirms October 15, 2026 with four new
    weapons, four vehicles, three buildables, rain weather, and progression and teamplay
    improvements. An experimental Wager Vendor is planned during the season, without
    a separate date. No exact Season 02 launch hour is announced.
  id: wardogs-season-02
  game_id: wardogs
  updated_at: '2026-10-13T06:04:42.309789+00:00'
- logical_key: pve-toggle-beta
  title: PvE Toggle Beta Test
  type: beta
  status: confirmed
  start_at: '2026-10-13T11:00:00+02:00'
  end_at: '2026-10-20T11:00:00+02:00'
  source_timezone: Europe/Prague
  source_url: https://arcraiders.com/news/pve-toggle-what-to-know
  notes: 'Official test window: October 13 at 11:00 CEST through October 20 at 11:00
    CEST. Optional PvE matchmaking removes player-to-player damage, lowers loot value,
    and excludes Night Raid, Locked Gate, Hidden Bunker, Frigate, and Redirection.
    This is a temporary beta, not confirmation of permanent PvE.'
  id: arc-raiders-pve-toggle-beta
  game_id: arc-raiders
  updated_at: '2026-10-13T06:04:42.309789+00:00'
- logical_key: trials-season-6-end
  title: 'Trials Season 6: Frozen Trials ends'
  type: season
  status: confirmed
  date: '2027-01-12'
  source_url: https://arcraiders.com/news/trials-season-6
  notes: Official end date for Trials Season 6, which began October 8, 2026. Weekly
    challenges award gear and Blueprints, with season-placement cosmetics including
    the Maestro Outfit. No exact closing hour or next-season start is announced.
  id: arc-raiders-trials-season-6-end
  game_id: arc-raiders
  updated_at: '2026-10-13T06:04:42.309789+00:00'
- logical_key: bcca-gods-of-zulaman
  title: 'Burning Crusade Classic Anniversary: Gods of Zul’Aman'
  type: major_update
  status: confirmed
  source_url: https://worldofwarcraft.blizzard.com/en-us/news/24310652/bcca-face-the-gods-of-zulaman-on-october-22
  notes: Official global launch is October 22, 2026 at 15:00 PDT / 23:00 BST, equivalent
    to October 23 at 00:00 Europe/Prague. Classic Anniversary content phase includes
    the 10-player Zul'Aman raid and substantial raid, dungeon, currency and gem updates;
    this is separate from Retail's Zul'Aman content.
  start_at: '2026-10-22T15:00:00-07:00'
  source_timezone: America/Los_Angeles
  id: world-of-warcraft-classic-bcca-gods-of-zulaman
  game_id: world-of-warcraft-classic

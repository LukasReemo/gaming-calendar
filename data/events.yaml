- logical_key: patch-12-1-5
  title: Midnight 12.1.5 Content Update (Europe)
  type: major_update
  status: confirmed
  source_url: https://worldofwarcraft.blizzard.com/en-gb/news/24307306
  notes: European announcement confirms October 14, 2026 with weekly maintenance;
    the US rollout is October 13. Includes a new single-boss raid, nine-chamber Labyrinth,
    Season 2 refresh, campaign and Aqir Invasions. No exact maintenance completion
    hour is supplied; these features are grouped as one content-update milestone.
  date: '2026-10-14'
  id: world-of-warcraft-retail-patch-12-1-5
  game_id: world-of-warcraft-retail

- logical_key: official-release
  title: Official Release
  type: release
  status: confirmed
  source_url: https://worldofwarcraft.blizzard.com/en-us/news/24303862/world-of-warcraft-forever-whats-next-panel-recap
  notes: Official global launch is November 4, 2026 at 15:00 PST, equivalent to November

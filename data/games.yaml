  latest_news: Update 1.1.9.6 activated Sponsored Perimeter for the weekend beginning
    October 29 and fixed contract bonus reputation and a Night Marsh dropship issue.
    Vault Breaker remains confirmed through November 10. The next qualifying major
    calendar milestone remains Symbiosis on December 8.
  latest_news_source_url: https://www.bungie.net/7/en/News/Article/marathon_update_1_1_9_6
  latest_news_updated_at: '2026-11-03T06:56:22+00:00'
- id: wardogs
  name: WARDOGS
  tracked_event_types:
  - release
  - expansion
  - dlc
  - season
  - major_update
  - beta
  - early_access
  latest_news: Season 02 is live with Update 0.2.0, adding four weapons, four vehicles,
    buildables, rain weather, and broad combat and controller changes. Role-track
    level 20 now requires 55 percent less XP, alongside revised unlocks, Lonestar
    bonuses, and a discount for losing teams. The Wager Vendor is explicitly unavailable
    at launch and will open later in the season without a confirmed date.
  latest_news_source_url: https://steamcommunity.com/app/1867240/announcements/
  latest_news_updated_at: '2026-10-16T06:03:11+00:00'

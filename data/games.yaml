  latest_news: The free Horrors of Kairos seasonal mini-event runs October 23-November
    6, changing world-boss weather to blood rain and adding the Murmur Legendary assault
    rifle and Skully Legendary grenade to boss rewards. A SHiFT code also grants two
    cosmetic rewards. No later major release date was verified.
  latest_news_source_url: https://borderlands.2k.com/en-GB/borderlands-4/news/horrors-of-kairos/
  latest_news_updated_at: '2026-10-27T06:58:15+00:00'

  - dlc
  - season
  - major_update
  - beta
  - early_access
  latest_news: Burning Crusade Classic Anniversary's Gods of Zul'Aman is now live
    with a 10-player raid, three-day reset and timed Amani War Bear challenge. The
    phase also removes several attunements, reduces Heroic-key reputation requirements,
    expands Badge of Justice sources and updates epic gems. No additional upcoming
    major Classic release date was verified.
  latest_news_source_url: https://news.blizzard.com/en-us/article/24310652/bcca-the-gods-of-zul-aman-now-live
  latest_news_updated_at: '2026-10-27T06:58:15+00:00'

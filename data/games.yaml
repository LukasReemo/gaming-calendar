  - early_access
  latest_news: The EU Forever Stress Test begins October 19, 2026 at 19:00 CEST, is
    open to anyone with a WoW account without an active subscription, and wipes test
    characters afterwards. October 21 remains the beta's last full testing day. Global
    release is November 4 at 15:00 PST, or November 5 at 00:00 in Prague, with initial
    raids unlocking December 9 without a verified opening hour.
  latest_news_source_url: https://eu.forums.blizzard.com/en/wow/t/wow-forever-stress-test-19-october/635831

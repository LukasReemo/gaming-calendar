  - early_access
  latest_news: Charting the Unknown launched October 29 at 22:00 UTC, or 23:00 in
    Prague, with version 2.04.00 available across Steam, PlayStation, Xbox and Epic.
    It adds character quests, ocean and underwater exploration, ships and maritime
    trading, expanded housing, claimable castles, business management, and broad gameplay
    improvements. No later dated major release was announced.
  latest_news_source_url: https://crimsondesert.pearlabyss.com/en-US/News/Notice/Detail?_boardNo=140
  latest_news_updated_at: '2026-10-30T07:00:04+00:00'
- id: arc-raiders
  name: ARC Raiders
  tracked_event_types:
  - release
  - expansion
  - dlc
  - season
  - major_update
  - beta
  - early_access
  latest_news: Live Update 2.3 launched October 27 with the Souls Offering player
    project, the Noxious Set, balance changes and extensive fixes. Embark is returning
    to fixes every three weeks while continuing weekly store updates. The PvE test
    results remain under review for a November follow-up, and Trials Season 6 still
    ends January 12, 2027.
  latest_news_source_url: https://arcraiders.com/news
  latest_news_updated_at: '2026-10-30T07:00:04+00:00'
- id: marathon
  name: Marathon
  tracked_event_types:
  - release
  - expansion
  - dlc
  - season
  - major_update
  - beta
  - early_access
  latest_news: Update 1.1.9.5 confirms Vault Breaker runs October 20-November 10 and
    revises its armory and economy, resolving the earlier official date conflict.
    The CARRI activity is active through the end of Nightfall Refresh, and Sponsored
    Night Marsh began October 22. The next qualifying major calendar milestone remains
    Symbiosis on December 8.
  latest_news_source_url: https://www.bungie.net/7/en/News/Article/marathon_update_1_1_9_5
  latest_news_updated_at: '2026-10-23T06:00:05+00:00'
- id: wardogs
  name: WARDOGS
  tracked_event_types:
  - release
  - expansion
  - dlc
  - season
  - major_update
  - beta
  - early_access
  latest_news: Season 02 is live with Update 0.2.0, adding four weapons, four vehicles,
    buildables, rain weather, and broad combat and controller changes. Role-track
    level 20 now requires 55 percent less XP, alongside revised unlocks, Lonestar
    bonuses, and a discount for losing teams. The Wager Vendor is explicitly unavailable
    at launch and will open later in the season without a confirmed date.
  latest_news_source_url: https://steamcommunity.com/app/1867240/announcements/
  latest_news_updated_at: '2026-10-16T06:03:11+00:00'
- id: world-of-warcraft-retail
  name: 'World of Warcraft: Retail'
  display_name: WoW:Retail
  tracked_event_types:

  latest_news: The Diablo IV 3.3.0 PTR for Season 16 runs October 27 at 10:00 PDT
    through November 3 at 10:00 PST. It previews major War Plans changes, reworked
    Infernal Hordes, Pit and Lair Boss activities, and new Horadric Items. Season
    16's exact live-launch date remains unannounced.
  latest_news_source_url: https://news.blizzard.com/en-us/article/24302578/the-3-3-0-ptr-what-you-need-to-know
  latest_news_updated_at: '2026-10-23T06:00:05+00:00'

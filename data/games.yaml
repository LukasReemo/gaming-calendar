  latest_news: Burning Crusade Classic Anniversary's Gods of Zul'Aman content phase
    launches October 22 at 15:00 PDT, which is October 23 at 00:00 in Prague. It adds
    the Zul'Aman raid and updates raid attunements, Heroic dungeons, Badges of Justice,
    and epic gems. Mists of Pandaria Classic's Siege of Orgrimmar is already live;
    no additional upcoming major Classic release date was verified.
  latest_news_source_url: https://worldofwarcraft.blizzard.com/en-us/news/24310652/bcca-face-the-gods-of-zulaman-on-october-22
  latest_news_updated_at: '2026-10-13T14:43:31+00:00'

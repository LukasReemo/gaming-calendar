  latest_news: Gearbox says Borderlands 4's Year 1 roadmap is complete after two Story
    Packs, five Bounty Packs, two Vault Hunters, and additional features and activities.
    More content is in development for next year without a confirmed release date,
    while weekly activities and community challenges will continue.
  latest_news_source_url: https://steamcommunity.com/app/1285190/announcements/
  latest_news_updated_at: '2026-11-24T06:58:20+00:00'

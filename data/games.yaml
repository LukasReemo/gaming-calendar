  - early_access
  latest_news: Path of Exile 2 still launches free-to-play on December 11, 2026, introducing
    the Duelist. The latest registration announcement says two community reward milestones
    have been unlocked, and existing Early Access owners must register separately
    and confirm their email to receive them. Registration remains open until December
    11.
  latest_news_source_url: https://www.pathofexile.com/forum/view-thread/4011278
  latest_news_updated_at: '2026-10-20T05:56:05+00:00'
- id: gray-zone-warfare
  name: Gray Zone Warfare
  tracked_event_types:
  - release
  - expansion
  - dlc
  - season
  - major_update
  - beta
  - early_access
  latest_news: Rogue Ops 0.5.0.1 is now live and moves Gray Zone Warfare from pre-alpha
    into alpha. The update adds the Hideout and crafting loop, smuggling and hunting,
    four-character support, three Tier 4 locations, seven weapons, more than 370 weapon
    parts, Unreal Engine 5.7 upgrades, and a seasonal soft wipe. MADFINGER says regular
    patches and hotfixes will follow, but no next major-update date is confirmed.
  latest_news_source_url: https://www.madfingergames.com/news/rogue-ops-out-now-changelog
  latest_news_updated_at: '2026-10-23T06:00:05+00:00'

  - early_access
  latest_news: 'Midnight: Echoes of the Worldcore arrives December 1 with regional
    maintenance, adding the Return to Dornogal campaign, Talebound, new Lorewalking
    quests, Turbulent Timeways, and Omnium Folio additions. WoW''s 22nd Anniversary
    Celebration runs November 17-December 8 at the Caverns of Time.'

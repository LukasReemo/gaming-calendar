  latest_news: Enshrouded 1.0 launched October 15, 2026, completing the map with Cinder's
    Cradle and adding Sparkworks adventure creation, new progression, and expanded
    combat options. Hotfix 1.0.0.3 on October 21 fixes missing Early Access rewards,
    crashes, save migration, and multiplayer loading issues. No upcoming major update
    or release with a confirmed date was found in the official announcements.
  latest_news_source_url: https://enshrouded.com/en-US/news

  latest_news: Update 2.1 launched the PvE matchmaking beta on October 13, with testing
    scheduled through October 20 at 11:00 CEST. The update also fixes Reward Pass
    progression, traversal, skills, and stability issues following Frozen Trail. Trials
    Season 6 remains active and ends January 12, 2027.
  latest_news_source_url: https://arcraiders.com/news/store-update-2-1-0

  - early_access
  latest_news: Charting the Unknown still launches October 29, 2026 at 22:00 UTC,
    or 23:00 in Prague. The official features overview details new character and ocean
    storylines, underwater exploration, upgraded housing, claimable castles, business
    management, and the Garden of Trials. Release-day patch notes are still forthcoming,
    and no later dated major release was announced.
  latest_news_source_url: https://crimsondesert.pearlabyss.com/EN-US/News/Notice/Detail?_boardNo=137
  latest_news_updated_at: '2026-10-23T06:00:05+00:00'
- id: arc-raiders
  name: ARC Raiders
  tracked_event_types:

  latest_news: Patch 3.2.3 is dated October 14, 2026 and addresses seasonal quest
    progression, boss encounters, Horadric Cube affix rerolls, and stability issues.
    Season of Hell's Legacy remains current, while the Amazon class pack is planned
    for the first half of 2027 without an exact date.
  latest_news_source_url: https://news.blizzard.com/en-us/article/24295395/diablo-iv-patch-notes
  latest_news_updated_at: '2026-10-16T06:03:11+00:00'
- id: path-of-exile-2
  name: Path of Exile 2
  tracked_event_types:
  - release
  - expansion
  - dlc
  - season
  - major_update
  - beta
  - early_access
  latest_news: Path of Exile 2 still launches free-to-play on December 11, 2026, introducing
    the Duelist. The latest registration announcement says two community reward milestones
    have been unlocked, and existing Early Access owners must register separately
    and confirm their email to receive them. Registration remains open until December
    11.
  latest_news_source_url: https://www.pathofexile.com/forum/view-thread/4011278
  latest_news_updated_at: '2026-10-20T05:56:05+00:00'
- id: gray-zone-warfare
  name: Gray Zone Warfare
  tracked_event_types:
  - release
  - expansion
  - dlc
  - season
  - major_update
  - beta
  - early_access
  latest_news: Rogue Ops remains scheduled for public release on October 22, 2026,
    with Supporter Preview listed for October 19. The final devlog details three upgradeable
    Hideout rooms, crafting and hacking tools, smuggling and hunting activities, and
    an Unreal Engine 5.7 upgrade with performance and anti-cheat improvements. Twitch
    Drops run October 22-November 6, but their usual 13:00 UTC stage time is not confirmation
    of the update's launch hour.
  latest_news_source_url: https://www.grayzonewarfare.com/news/new-features-rogue-ops-devlog
  latest_news_updated_at: '2026-10-20T05:56:05+00:00'

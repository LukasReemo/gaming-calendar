  latest_news: 'World of Warcraft: Forever launches globally November 4 at 15:00 PST,
    or November 5 at 00:00 in Prague. Launch includes four rulesets, new and reimagined
    zones, more than 1,000 quests, nine new dungeons, the Skyborne race, the Legacy
    System, and a level-60 journey. Barrow Deeps, Hyjal Summit and Onyxia''s Lair
    unlock December 9.'
  latest_news_source_url: https://news.blizzard.com/en-us/article/24315820/world-of-warcraft-forever-goes-live-globally-november-4
  latest_news_updated_at: '2026-11-03T06:56:22+00:00'

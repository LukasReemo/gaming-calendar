  latest_news: Diablo IV Season 16, Season of Tyrael's Gambit, launches December 1
    at 9:30 a.m. Pacific Time. It adds a dual Reaper boss encounter, revamped War
    Plans, Tyrael's Boons, Horadric Items, persistent Helltide changes, and selected
    permanent features from Season of Hell's Legacy.
  latest_news_source_url: https://news.blizzard.com/en-us/article/24316979/advance-the-war-against-death-in-season-of-tyraels-gambit
  latest_news_updated_at: '2026-11-27T07:00:03+00:00'

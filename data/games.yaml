  latest_news: WoW's 21st Anniversary Celebration runs November 16-December 7 at the
    Caverns of Time, with a 20 percent XP and reputation bonus, event currencies,
    activities, and the Loyal Watchman ensemble. Quests and activity completions are
    tracked Warband-wide. Echoes of the Worldcore still has no confirmed live-launch
    date.
  latest_news_source_url: https://news.blizzard.com/en-us/article/24242432/join-the-world-of-warcraft-21st-anniversary-celebration
  latest_news_updated_at: '2026-11-03T06:56:22+00:00'

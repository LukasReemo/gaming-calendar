  latest_news: 'The September 10 content release added Story Pack 2: FL4K and the
    Last Resort, the playable Vault Hunter Loveless the Hacker, and Bounty Pack 5:
    Amara and the Vile Shadows. The accompanying free Version 1.10 update increased
    the level cap by ten.'
  latest_news_source_url: https://newsroom-uk.2k.com/news/borderlandsr-4-story-pack-2-fl4k-and-the-last-resort-launching-on-september-10-alongside-all-new-vault-hunter-and-bounty-pack-5-amara-and-the-vile-shadows
  latest_news_updated_at: '2026-10-05T18:38:49Z'

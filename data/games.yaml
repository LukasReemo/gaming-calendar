  - dlc
  - season
  - major_update
  - beta
  - early_access
  latest_news: Midnight 12.1.5 is live with the Kith'ix raid, Labyrinth of Kindo'jan,
    Season 2 mid-season refresh, campaign, and Aqir Invasions. Blizzard has previewed
    Echoes of the Worldcore on the PTR, including Return to Dornogal, the Talebound
    PvE mode, Lorewalking stories, Turbulent Timeways, and Omnium Folio additions.
    No exact launch date for Echoes of the Worldcore was verified.
  latest_news_source_url: https://news.blizzard.com/en-us/article/24313102/wow-weekly-highlights-midnight-12-1-5-worldcore-wow-forever-and-more
  latest_news_updated_at: '2026-10-23T06:00:05+00:00'

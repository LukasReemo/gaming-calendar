  - expansion
  - dlc
  - season
  - major_update
  - beta
  - early_access
  latest_news: A Housing PTR test runs October 30-31 and focuses on guild neighborhoods
    after resetting existing houses and neighborhoods; a Midnight license is not required.
    The Talebound PTR demo separately runs October 30-November 1 with three tales,
    classes and difficulty levels. Echoes of the Worldcore still has no confirmed
    live-launch date.
  latest_news_source_url: https://news.blizzard.com/en-us/article/24241096/updated-10-30-midnight-prologue-the-warning-content-update-and-housing-early-access
  latest_news_updated_at: '2026-10-30T07:00:04+00:00'

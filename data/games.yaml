  latest_news: Patch 1.0.1.0 launched November 2 with improvements to boss behavior,
    combat targeting, enemy loot, balance, controls and numerous fixes. It also adds
    a sprint toggle and reduces cases where defeated Fell enemies have no loot, with
    another loot fix planned for a later update. No upcoming major update or release
    has a confirmed date.
  latest_news_source_url: https://enshrouded.com/en-US/news/changelog-for-patch-1

  latest_news: Enshrouded 1.0 launched October 15, completing the map with Cinder's
    Cradle and adding Sparkworks adventure creation, new progression and expanded
    combat options. Keen Games announced on October 23 that Enshrouded 1.0 is Steam
    Deck Verified and said more fixes and improvements would follow the next week.
    No upcoming major update or release has a confirmed date.
  latest_news_source_url: https://enshrouded.com/en-US/news/enshrouded-is-steam-deck-verified

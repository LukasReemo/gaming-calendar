  - expansion
  - dlc
  - season
  - major_update
  - beta
  - early_access
  latest_news: The PvE matchmaking toggle beta ended as scheduled on October 20 after
    more than 30 million PvE rounds. Embark says the result was polarizing and expects
    to share further information in November after reviewing data and feedback. Update
    2.2 added the Wreck Set and fixes, while Trials Season 6 still ends January 12,
    2027.
  latest_news_source_url: https://arcraiders.com/news/pve-test-thanks-for-playing
  latest_news_updated_at: '2026-10-23T06:00:05+00:00'
- id: marathon
  name: Marathon
  tracked_event_types:
  - release
  - expansion
  - dlc
  - season
  - major_update
  - beta
  - early_access
  latest_news: Update 1.1.9.5 confirms Vault Breaker runs October 20-November 10 and
    revises its armory and economy, resolving the earlier official date conflict.
    The CARRI activity is active through the end of Nightfall Refresh, and Sponsored
    Night Marsh began October 22. The next qualifying major calendar milestone remains
    Symbiosis on December 8.
  latest_news_source_url: https://www.bungie.net/7/en/News/Article/marathon_update_1_1_9_5
  latest_news_updated_at: '2026-10-23T06:00:05+00:00'
- id: wardogs
  name: WARDOGS
  tracked_event_types:
  - release
  - expansion
  - dlc
  - season
  - major_update
  - beta
  - early_access
  latest_news: Season 02 is live with Update 0.2.0, adding four weapons, four vehicles,
    buildables, rain weather, and broad combat and controller changes. Role-track
    level 20 now requires 55 percent less XP, alongside revised unlocks, Lonestar
    bonuses, and a discount for losing teams. The Wager Vendor is explicitly unavailable
    at launch and will open later in the season without a confirmed date.
  latest_news_source_url: https://steamcommunity.com/app/1867240/announcements/
  latest_news_updated_at: '2026-10-16T06:03:11+00:00'

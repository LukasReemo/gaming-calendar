  - major_update
  - beta
  - early_access
  latest_news: Eligible purchasers can reserve up to three WoW Forever character names
    from October 27 at 18:00 CET in Europe through November 3. Global release remains
    November 4 at 15:00 PST, or November 5 at 00:00 in Prague, with initial raids
    dated December 9. No new exact post-launch major-update date was announced.
  latest_news_source_url: https://news.blizzard.com/en-us/article/24303866/claim-your-world-of-warcraft-forever-character-names
  latest_news_updated_at: '2026-10-23T06:00:05+00:00'

  latest_news: Charting the Unknown launched October 29 at 22:00 UTC, or 23:00 in
    Prague, with version 2.04.00. Hotfix 2.04.05 on November 1 fixes progression blockers
    affecting Ravok, Damiane's End and Beginning quest, witch proposals, and Kliff's
    Beyond the Margins quest. No later dated major release was announced.
  latest_news_source_url: https://crimsondesert.pearlabyss.com/EN-US/News/Notice/Detail?_boardNo=149
  latest_news_updated_at: '2026-11-03T06:56:22+00:00'

  - dlc
  - season
  - major_update
  - beta
  - early_access
  latest_news: Charting the Unknown still launches October 29, 2026 at 22:00 UTC,
    or 23:00 in Prague. The revised preorder notice confirms availability on PlayStation,
    Xbox, Steam, and Epic but excludes Mac App Store at launch. The DLC will be unavailable
    in certain markets following content and age-rating reviews, with affected preorders
    closed and refunds handled by platform.
  latest_news_source_url: https://crimsondesert.pearlabyss.com/en-US/News/Notice/Detail?_boardNo=129
  latest_news_updated_at: '2026-10-13T06:04:42.309789+00:00'
- id: arc-raiders
  name: ARC Raiders
  tracked_event_types:
  - release
  - expansion
  - dlc
  - season
  - major_update
  - beta
  - early_access
  latest_news: Update 2.1 launched the PvE matchmaking beta on October 13, with testing
    scheduled through October 20 at 11:00 CEST. The update also fixes Reward Pass
    progression, traversal, skills, and stability issues following Frozen Trail. Trials
    Season 6 remains active and ends January 12, 2027.
  latest_news_source_url: https://arcraiders.com/news/store-update-2-1-0
  latest_news_updated_at: '2026-10-16T06:03:11+00:00'
- id: marathon
  name: Marathon
  tracked_event_types:
  - release
  - expansion
  - dlc
  - season
  - major_update
  - beta
  - early_access
  latest_news: Nightfall Refresh is live with reset progression, revised faction requirements,
    a free permanent Rewards Pass, and gentler solo PvE combat. Symbiosis arrives
    December 8 with permanent PvE, an expanded Perimeter, the Bishop shell, Team Deathmatch,
    and a social space with a firing range. A broader evolution is planned for March
    2027 without an exact day.
  latest_news_source_url: https://www.bungie.net/7/en/News/Article/nighfall_refresh_symbiosis_roadmap
  latest_news_updated_at: '2026-10-07T15:47:52+00:00'
- id: wardogs
  name: WARDOGS
  tracked_event_types:
  - release
  - expansion
  - dlc
  - season
  - major_update
  - beta
  - early_access
  latest_news: Season 02 is live with Update 0.2.0, adding four weapons, four vehicles,
    buildables, rain weather, and broad combat and controller changes. Role-track
    level 20 now requires 55 percent less XP, alongside revised unlocks, Lonestar
    bonuses, and a discount for losing teams. The Wager Vendor is explicitly unavailable
    at launch and will open later in the season without a confirmed date.
  latest_news_source_url: https://steamcommunity.com/app/1867240/announcements/
  latest_news_updated_at: '2026-10-16T06:03:11+00:00'
- id: world-of-warcraft-retail
  name: 'World of Warcraft: Retail'
  display_name: WoW:Retail
  tracked_event_types:
  - release
  - expansion
  - dlc
  - season
  - major_update
  - beta
  - early_access
  latest_news: Midnight 12.1.5 is live, with additional Ascendant Venomstone upgrades
    and the crest-cap lift scheduled during maintenance in the week of October 20.
    Blizzard has previewed Echoes of the Worldcore on the PTR, including Return to
    Dornogal, the solo-or-group Talebound PvE mode, Lorewalking stories, Turbulent
    Timeways, and Omnium Folio additions. No exact launch date for Echoes of the Worldcore
    was verified.
  latest_news_source_url: https://news.blizzard.com/en-us/article/24310659/midnight-echoes-of-the-worldcore-overview
  latest_news_updated_at: '2026-10-20T05:56:05+00:00'
- id: world-of-warcraft-classic
  name: 'World of Warcraft: Classic'
  display_name: WoW:Classic
  tracked_event_types:
  - release
  - expansion
  - dlc
  - season
  - major_update
  - beta
  - early_access
  latest_news: Burning Crusade Classic Anniversary's Gods of Zul'Aman content phase
    launches October 22 at 15:00 PDT, which is October 23 at 00:00 in Prague. It adds
    the Zul'Aman raid and updates raid attunements, Heroic dungeons, Badges of Justice,
    and epic gems. Mists of Pandaria Classic's Siege of Orgrimmar is already live;
    no additional upcoming major Classic release date was verified.
  latest_news_source_url: https://worldofwarcraft.blizzard.com/en-us/news/24310652/bcca-face-the-gods-of-zulaman-on-october-22
  latest_news_updated_at: '2026-10-13T14:43:31+00:00'
- id: world-of-warcraft-forever
  name: 'World of Warcraft: Forever'
  display_name: WoW:Forever
  tracked_event_types:
  - release
  - expansion
  - dlc
  - season
  - major_update
  - beta
  - early_access
  latest_news: Blizzard moved the EU Forever Stress Test from October 19 to October
    21, 2026 at 19:00 CEST; it needs no subscription or beta access and wipes stress-test
    characters afterwards. October 21 remains the beta's last full testing day, while
    eligible purchasers can reserve names October 27-November 3. Global release remains
    November 4 at 15:00 PST, or November 5 at 00:00 in Prague, with initial raids
    dated December 9.
  latest_news_source_url: https://news.blizzard.com/en-us/article/24302072/updated-oct-16-join-the-world-of-warcraft-forever-stress-test
  latest_news_updated_at: '2026-10-20T05:56:05+00:00'

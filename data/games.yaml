  latest_news: Live Update 2.6.0 launched November 17 with fixes and improvements,
    a new Stencil set, and the return of Cold Snap. Embark says a new project is arriving
    next week but gives no exact date, so it is not yet eligible for the calendar;
    Trials Season 6 still ends January 12, 2027.

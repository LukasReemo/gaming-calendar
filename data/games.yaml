  latest_news: Midnight 12.1.5 is live with the nine-chamber Labyrinth of Kindo'jan,
    the Kith'ix raid, Aqir Invasions, and the Season 2 refresh. During maintenance
    in the week of October 20, Ascendant Venomstones unlock further upgrades and the
    crest cap is lifted. Season 3, Eclipse, and The Last Titan still lack a newly
    verified exact release date.
  latest_news_source_url: https://news.blizzard.com/en-us/article/24307306/midnight-s-12-1-5-content-update-is-now-live

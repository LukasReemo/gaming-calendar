  - major_update
  - beta
  - early_access
  latest_news: Live Update 2.3 launched October 27 with the Souls Offering player
    project, the Noxious Set, balance changes and extensive fixes. Embark is returning
    to fixes every three weeks while continuing weekly store updates. The PvE test
    results remain under review for a November follow-up, and Trials Season 6 still
    ends January 12, 2027.
  latest_news_source_url: https://arcraiders.com/news
  latest_news_updated_at: '2026-10-30T07:00:04+00:00'

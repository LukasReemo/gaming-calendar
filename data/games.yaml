  latest_news: Rogue Ops adds seven weapons, 370 weapon parts, three Tier 4 locations,
    smaller exploration areas, and new tasks alongside Hideout, crafting, and multiple
    characters. A soft wipe preserves rank, apparel, vendor levels, and completed
    tasks while resetting lockers and money. Supporter Preview starts October 19,
    followed by the public update on October 22, 2026.

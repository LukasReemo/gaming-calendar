  latest_news: Burning Crusade Classic Anniversary's Gods of Zul'Aman content phase
    launched October 22 at 15:00 PDT, which was October 23 at 00:00 in Prague. It
    adds the Zul'Aman raid and updates raid attunements, Heroic dungeons, Badges of
    Justice, and epic gems. No additional upcoming major Classic release date was
    verified; Retail and Forever announcements were excluded.
  latest_news_source_url: https://worldofwarcraft.blizzard.com/en-us/news/24310652/bcca-face-the-gods-of-zulaman-on-october-22
  latest_news_updated_at: '2026-10-23T06:00:05+00:00'

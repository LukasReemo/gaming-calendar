  latest_news: Bethesda plans to release World Pets on December 1, letting players
    bring their camp pets into the wasteland and take on bounties in Skyline Valley.
    A November 13 PTS update added pet-leveling consumables and temporarily deactivated
    Hideouts testing; Hideouts remain planned for spring 2027.
  latest_news_source_url: https://fallout.bethesda.net/en-US/news/inside-the-vault-world-pets-and-hideouts-public-test-server

  latest_news: The Talebound PTR demo runs October 30-November 1 without requiring
    a subscription. It includes the Red Hollow introduction, three tales, the Slayer,
    Inquisitor and Witch classes, and Normal, Veteran and Heroic difficulties. The
    full Echoes of the Worldcore update still has no confirmed launch date.
  latest_news_source_url: https://news.blizzard.com/en-us/article/24313107/join-in-the-talebound-demo-on-october-30
  latest_news_updated_at: '2026-10-27T06:58:15+00:00'

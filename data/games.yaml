  latest_news: The Diablo IV 3.3.0 PTR for Season 16 ended November 3 after testing
    War Plans Tactics, reworked Infernal Hordes, Pit and Lair Boss activities, and
    new Horadric Items. Blizzard still has not announced Season 16's live-launch date.
  latest_news_source_url: https://news.blizzard.com/en-us/article/24302578/the-3-3-0-ptr-what-you-need-to-know

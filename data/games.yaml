  latest_news: Early Name Reservation opens October 27 at 18:00 CET in Europe and
    runs through November 3 for up to three characters. Global release remains November
    4 at 15:00 PST, or November 5 at 00:00 in Prague, with Normal, PvP, Roleplaying
    and Roleplay-PvP rulesets at launch. Barrow Deeps, Hyjal Summit and Onyxia's Lair
    unlock December 9.
  latest_news_source_url: https://news.blizzard.com/en-us/article/24313106/dive-into-wow-forever-the-gods-of-zulaman-hallows-end-and-more-in-wow-weekly

  - season
  - major_update
  - beta
  - early_access
  latest_news: 'Update 1.1.9.7 brought back Ordnance Heist for November 10-24, added
    sponsored Night Marsh from November 12 and sponsored Survival: Perimeter through
    November 17, and shipped fixes. These limited activities remain news-only. The
    next qualifying major calendar milestone remains Symbiosis on December 8.'
  latest_news_source_url: https://www.bungie.net/7/en/News/Article/marathon_update_1_1_9_7
  latest_news_updated_at: '2026-11-13T07:02:00+00:00'
